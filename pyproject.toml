[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens"
version = "0.1.0"
description = "Companion code for 'Verbalizable Representations Form a Global Workspace in Language Models'"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch",
    "huggingface_hub",
    "transformers>=5.5",
    "numpy",
]

[project.urls]
Repository = "https://github.com/anthropics/jacobian-lens"
Paper = "https://transformer-circuits.pub/2026/workspace/index.html"

[project.optional-dependencies]
dev = ["pytest", "ruff", "datasets"]
tracking = ["mlflow>=2.14"]
tuned = ["tuned-lens>=0.2"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]

[tool.setuptools]
packages = ["jlens"]

[tool.setuptools.package-data]
jlens = ["data/*"]

[dependency-groups]
dev = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "ipython>=8.39.0",
    "jupyter>=1.1.1",
    "tabulate>=0.10.0",
    "seaborn>=0.13.2",
    "mistune>=3.0",
]
# Modal is kept separate from the default environment because it is only
# needed for cloud GPU jobs and authentication/CLI workflows.
cloud = [
    "modal>=1.0",
]
